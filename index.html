<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open World 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #app { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #app:active { cursor: grabbing; }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #overlay.hidden { opacity: 0; }

    #overlay .card {
      background: rgba(10, 14, 10, 0.55);
      backdrop-filter: blur(6px);
      color: #f4f4f0;
      padding: 24px 32px;
      border-radius: 14px;
      text-align: center;
      line-height: 1.7;
      font-size: 15px;
    }
    #overlay .card b { color: #ffd27a; }

    #hud {
      position: fixed;
      bottom: 14px;
      left: 14px;
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      font-family: monospace;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="overlay">
    <div class="card">
      <b>WASD</b> / panah — jalan &nbsp;•&nbsp; <b>Shift</b> — lari &nbsp;•&nbsp; <b>Space</b> — lompat<br/>
      <b>Drag mouse</b> — putar kamera &nbsp;•&nbsp; <b>Scroll</b> — zoom
    </div>
  </div>

  <div id="hud">openworld3d — three.js demo</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
